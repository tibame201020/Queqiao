name: Distribution and Cluster Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: distribution-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-setup-flow:
    name: CLI setup flow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:cli-setup

  full-test:
    name: Full test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        run: npm test -- --maxWorkers=2

  package-install:
    name: Self-contained package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build:package
      - shell: bash
        run: |
          mkdir package-test
          npm pack --ignore-scripts --pack-destination package-test >/dev/null
          tarball="$(find "$(pwd)/package-test" -name '*.tgz' -print -quit)"
          npm install --prefix package-test/install "$tarball" --ignore-scripts
          package-test/install/node_modules/.bin/queqiao doctor paths
          (cd package-test/install && node --input-type=module -e "const m=await import('@tibame201020/queqiao/extension'); if(typeof m.defineExtension!=='function') throw new Error('defineExtension export missing')")

  linux-gateway-cluster:
    name: Linux Gateway and Worker handshake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:cluster
      - shell: bash
        run: |
          mkdir package-test
          npm pack --pack-destination package-test >/dev/null
          sh scripts/linux-package-integration.sh "$(find "$(pwd)/package-test" -name '*.tgz' -print -quit)"
