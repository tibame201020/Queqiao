name: Distribution and Cluster Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: distribution-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test:
    name: Full test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  package-install:
    name: Self-contained package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - shell: bash
        run: |
          mkdir package-test
          npm pack --pack-destination package-test >/dev/null
          tarball="$(find "$(pwd)/package-test" -name '*.tgz' -print -quit)"
          npm install --prefix package-test/install "$tarball" --ignore-scripts
          package-test/install/node_modules/.bin/queqiao config paths

  linux-gateway-cluster:
    name: Linux Gateway and Worker handshake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run security:gate
      - run: npm run test:cluster
      - shell: bash
        run: |
          mkdir package-test
          npm pack --pack-destination package-test >/dev/null
          sh scripts/linux-package-integration.sh "$(find "$(pwd)/package-test" -name '*.tgz' -print -quit)"