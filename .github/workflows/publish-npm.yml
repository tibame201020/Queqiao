name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish with npm provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "::error::Release ref must be a v-prefixed tag"; exit 1 ;;
          esac
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version" || {
            echo "::error::Release tag $RELEASE_TAG does not match package version $version"
            exit 1
          }
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG")" = "$RELEASE_TAG" || {
            echo "::error::Checked-out commit is not tagged $RELEASE_TAG"
            exit 1
          }
      - run: npm ci --ignore-scripts
      - run: npm run security:gate
      - run: npm run resource:gate
      - name: Require npm publishing credential
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || {
            echo "::error::Repository secret NPM_TOKEN is required for the first npm publication"
            exit 1
          }
      - name: Publish public package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
