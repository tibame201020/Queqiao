name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish with npm provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "::error::Release ref must be a v-prefixed tag"; exit 1 ;;
          esac
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version" || {
            echo "::error::Release tag $RELEASE_TAG does not match package version $version"
            exit 1
          }
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG")" = "$RELEASE_TAG" || {
            echo "::error::Checked-out commit is not tagged $RELEASE_TAG"
            exit 1
          }
      - run: npm ci --ignore-scripts
      - run: npm run release:gate
      - name: Build publish artifact
        run: npm run build:package
      - name: Verify trusted publishing toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm_version="$(npm --version)"
          echo "npm v$npm_version"
          node -e "const [M,m,p]=process.argv[1].split('.').map(Number); if (M < 11 || (M === 11 && (m < 5 || (m === 5 && p < 1)))) process.exit(1)" "$npm_version"
      - name: Publish public package with trusted publishing
        shell: bash
        run: |
          set -euo pipefail

          set +e
          npm run release:verify-registry -- --exists-only
          probe_status=$?
          set -e

          if [ "$probe_status" -eq 0 ]; then
            echo "Exact package version is already visible; skipping duplicate publish."
          elif [ "$probe_status" -eq 2 ]; then
            publish_log="$RUNNER_TEMP/npm-publish.log"
            set +e
            npm publish --provenance --access public --ignore-scripts 2>&1 | tee "$publish_log"
            publish_status=${PIPESTATUS[0]}
            set -e

            if [ "$publish_status" -ne 0 ]; then
              if grep -Eqi 'previously staged version|EPUBLISHCONFLICT|Cannot publish over' "$publish_log"; then
                echo "::warning::npm reports the version is already staged; waiting for registry promotion."
              else
                exit "$publish_status"
              fi
            fi
          else
            exit "$probe_status"
          fi

          npm run release:verify-registry -- --timeout-ms 600000 --interval-ms 10000
