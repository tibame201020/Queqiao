name: Browser Harness Session Portability POC

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/browser-harness-session-portability.yml"
      - "packages/browser-harness-runtime/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:
    inputs:
      gate2:
        description: "After Gate 1 authenticated Composer, send exactly one synthetic UI prompt and verify actual finished answer"
        type: boolean
        default: false
        required: false
      gate3:
        description: "Real synthetic content generation in ephemeral authenticated Chrome; saves only validated draft artifact"
        type: boolean
        default: false
        required: false
      gate3_publish:
        description: "After Gate 3 success, create only signal-notes test branch and draft PR (requires scoped credential)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Unit test Browser Harness
        run: npx vitest run packages/browser-harness-runtime/src

  session-portability:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate one gate selection
        env:
          GATE2: ${{ inputs.gate2 && '1' || '0' }}
          GATE3: ${{ inputs.gate3 && '1' || '0' }}
          PUBLISH: ${{ inputs.gate3_publish && '1' || '0' }}
        run: |
          if [ "$GATE2" = "1" ] && [ "$GATE3" = "1" ]; then exit 1; fi
          if [ "$PUBLISH" = "1" ] && [ "$GATE3" != "1" ]; then exit 1; fi

      - name: Validate session capsule secret
        shell: bash
        env:
          CHATGPT_BROWSER_SESSION_CAPSULE: ${{ secrets.CHATGPT_BROWSER_SESSION_CAPSULE }}
          CHATGPT_BROWSER_SESSION_CAPSULE_PART_1: ${{ secrets.CHATGPT_BROWSER_SESSION_CAPSULE_PART_1 }}
          CHATGPT_BROWSER_SESSION_CAPSULE_PART_2: ${{ secrets.CHATGPT_BROWSER_SESSION_CAPSULE_PART_2 }}
        run: |
          set -euo pipefail
          # Never echo secrets. Partial update fails closed rather than using old capsule.
          if [ -n "$CHATGPT_BROWSER_SESSION_CAPSULE_PART_1" ] || [ -n "$CHATGPT_BROWSER_SESSION_CAPSULE_PART_2" ]; then
            if [ -z "$CHATGPT_BROWSER_SESSION_CAPSULE_PART_1" ] || [ -z "$CHATGPT_BROWSER_SESSION_CAPSULE_PART_2" ]; then
              echo "::error::Incomplete two-part session secret"
              exit 1
            fi
            if [ "${#CHATGPT_BROWSER_SESSION_CAPSULE_PART_1}" -ge 48000 ] || [ "${#CHATGPT_BROWSER_SESSION_CAPSULE_PART_2}" -ge 48000 ]; then
              echo "::error::Session secret part exceeds the workflow size limit"
              exit 1
            fi
          elif [ -z "$CHATGPT_BROWSER_SESSION_CAPSULE" ] || [ "${#CHATGPT_BROWSER_SESSION_CAPSULE}" -ge 48000 ]; then
            echo "::error::Session secret missing or exceeds the single-part workflow size limit"
            exit 1
          fi

      - name: Start manual Chrome Browser Harness
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then
            echo "Google Chrome is not installed on this runner."
            exit 1
          fi

          Xvfb :99 -screen 0 1280x1024x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/xvfb.pid"
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

          profile="$RUNNER_TEMP/chatgpt-browser-profile"
          mkdir -p "$profile"
          "$chrome"             --user-data-dir="$profile"             --profile-directory=Default             --remote-debugging-port=9555             --remote-allow-origins=*             --no-first-run             --no-default-browser-check             --disable-default-apps             --no-sandbox             --disable-dev-shm-usage             about:blank             > "$RUNNER_TEMP/chrome.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/chrome.pid"

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9555/json/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/chrome.log"
          exit 1

      - name: Set isolated Gate 3 Taipei date
        if: inputs.gate3
        run: echo "GATE3_DATE=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_ENV"

      - name: Restore ChatGPT session into fresh Browser Harness
        env:
          CHATGPT_BROWSER_SESSION_CAPSULE: ${{ secrets.CHATGPT_BROWSER_SESSION_CAPSULE }}
          CHATGPT_BROWSER_SESSION_CAPSULE_PART_1: ${{ secrets.CHATGPT_BROWSER_SESSION_CAPSULE_PART_1 }}
          CHATGPT_BROWSER_SESSION_CAPSULE_PART_2: ${{ secrets.CHATGPT_BROWSER_SESSION_CAPSULE_PART_2 }}
          BROWSER_CDP_URL: http://127.0.0.1:9555
          CHATGPT_BROWSER_GATE2: ${{ inputs.gate2 && '1' || '0' }}
          CHATGPT_BROWSER_GATE3: ${{ inputs.gate3 && '1' || '0' }}
          GATE3_OUTPUT_DIR: ${{ runner.temp }}/gate3-out
        run: npx tsx packages/browser-harness-runtime/src/session-acceptance.ts

      - name: Upload only validated public synthetic draft and receipt
        if: inputs.gate3 && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate3-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-out/gate3-artifact.json
          retention-days: 7
          if-no-files-found: error

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "--- Chrome ---"
          tail -120 "$RUNNER_TEMP/chrome.log" 2>/dev/null || true
          echo "--- Xvfb ---"
          tail -80 "$RUNNER_TEMP/xvfb.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/chrome.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/chrome.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/xvfb.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/xvfb.pid")" 2>/dev/null || true
          fi

  publish-gate3-draft:
    # Cross-repo write requires an explicitly scoped, approved Secret.
    # No secret is present in PR CI, and this job never writes signal-notes/main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.gate3 && inputs.gate3_publish
    needs: session-portability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require separate scoped signal-notes credential
        env:
          SIGNAL_NOTES_GATE3_TOKEN: ${{ secrets.SIGNAL_NOTES_GATE3_TOKEN }}
        run: |
          if [ -z "$SIGNAL_NOTES_GATE3_TOKEN" ]; then
            echo "::error::GATE3_MISSING_CROSS_REPO_CREDENTIAL"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate3-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-in
      - name: Checkout signal-notes main to isolated directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tibame201020/signal-notes
          ref: main
          token: ${{ secrets.SIGNAL_NOTES_GATE3_TOKEN }}
          path: signal-notes-target
          fetch-depth: 0
      - name: Validate target has no prior branch; fail closed on duplicate
        shell: bash
        run: |
          set -euo pipefail
          date_value="$(TZ=Asia/Taipei date +%F)"
          branch="gate3/synthetic-${date_value}"
          if git -C signal-notes-target ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "::error::GATE3_DUPLICATE_BRANCH"
            exit 1
          fi
          echo "GATE3_EXPECTED_DATE=$date_value" >> "$GITHUB_ENV"
      - name: Validate receipt and prepare draft-only file
        env:
          SIGNAL_NOTES_GATE3_TOKEN: ${{ secrets.SIGNAL_NOTES_GATE3_TOKEN }}
          GATE3_EXPECTED_RUN_ID: ${{ github.run_id }}
        run: npx tsx packages/browser-harness-runtime/src/gate3-publication-prepare.ts "$RUNNER_TEMP/gate3-in/gate3-artifact.json" signal-notes-target
      - name: Run signal-notes publication validation before push
        working-directory: signal-notes-target
        run: |
          npm ci
          npm run test:investment
          npm run validate:investment
          npm run test:market
          npm run validate:language
          npm run build
      - name: Commit to new test branch and open draft PR only
        working-directory: signal-notes-target
        env:
          GH_TOKEN: ${{ secrets.SIGNAL_NOTES_GATE3_TOKEN }}
        run: |
          set -euo pipefail
          git checkout -b "$GATE3_TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$GATE3_ARTICLE_PATH"
          git diff --cached --quiet && exit 1
          git commit -m "test(content): isolated Gate 3 synthetic draft ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$GATE3_TARGET_BRANCH"
          gh pr create --repo tibame201020/signal-notes --head "$GATE3_TARGET_BRANCH" --base main --draft --title "test: Gate 3 synthetic content ${GITHUB_RUN_ID}" --body "Synthetic draft-only acceptance from Queqiao hosted run ${GITHUB_RUN_ID}. Do not merge or publish as a daily article."
