name: Phase 3 Actions Worker Browser Harness E2E

on:
  workflow_dispatch:
    inputs:
      gate3_worker:
        description: "Manual same-Worker authenticated Gate 3 synthetic content only"
        type: boolean
        default: false
        required: false
      gate3_date:
        description: "Pinned YYYY-MM-DD synthetic date, required for gate3_worker"
        type: string
        default: ""
        required: false
      gate3_mcp_audit:
        description: "Manual main-only: opt in to one audited Queqiao MCP synthetic Worker read"
        type: boolean
        default: false
        required: false
      gate3_delegated_handoff:
        description: "Main-only: export exact verified public Worker article after disposal; no target write"
        type: boolean
        default: false
        required: false
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/runtime-provider-poc-controller.yml"
      - ".github/workflows/runtime-provider-poc-worker.yml"
      - "packages/runtime-provider-github-actions/**"
      - "packages/runtime-control/**"
      - "packages/worker-protocol/**"
      - "apps/gateway/**"
      - "apps/worker/**"
      - "packages/browser-harness-runtime/**"
      - "apps/gateway/src/poc-browser-worker-*"
      - ".github/workflows/runtime-provider-browser-controller.yml"

permissions:
  contents: read
  actions: write

jobs:
  phase3-e2e:
    if: (github.event_name == 'pull_request' && github.head_ref == 'feat/124-actions-worker-browser' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Validate G3.2 requested task and fixed date
        shell: bash
        env:
          GATE3_WORKER: ${{ inputs.gate3_worker && '1' || '0' }}
          REQUESTED_DATE: ${{ inputs.gate3_date }}
          REQUESTED_AUDIT: ${{ inputs.gate3_mcp_audit && '1' || '0' }}
          REQUESTED_DELEGATED: ${{ inputs.gate3_delegated_handoff && '1' || '0' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const enabled=process.env.GATE3_WORKER==="1",d=process.env.REQUESTED_DATE||"";
          if(!enabled && d)process.exit(1);
          if(process.env.REQUESTED_AUDIT==="1" && !enabled)process.exit(1);
          if(process.env.REQUESTED_DELEGATED==="1" && (!enabled||process.env.REQUESTED_AUDIT!=="1"))process.exit(1);
          if(enabled && (process.env.GITHUB_EVENT_NAME!=="workflow_dispatch" ||
             process.env.GITHUB_REF!=="refs/heads/main" ||
             !/^\d{4}-\d{2}-\d{2}$/.test(d) ||
             Number.isNaN(Date.parse(d)) || new Date(d).toISOString().slice(0,10)!==d))
             process.exit(1);
          NODE
          echo "G3_WORKER=$GATE3_WORKER" >> "$GITHUB_ENV"
          echo "G3_MCP_AUDIT=$REQUESTED_AUDIT" >> "$GITHUB_ENV"
          echo "G345_DELEGATED_HANDOFF=$REQUESTED_DELEGATED" >> "$GITHUB_ENV"
          if [ "$GATE3_WORKER" = "1" ]; then
            echo "G3_DATE=$REQUESTED_DATE" >> "$GITHUB_ENV"
          fi

      - name: Start temporary public tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cloudflared"             https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:7575             > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cloudflared.pid"

          public_url=""
          for i in {1..45}; do
            public_url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -1 || true)"
            if [ -n "$public_url" ]; then break; fi
            sleep 1
          done
          if [ -z "$public_url" ]; then
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi
          echo "PUBLIC_URL=${public_url%/}" >> "$GITHUB_ENV"

      - name: Bootstrap Phase 3 Gateway
        shell: bash
        env:
          PROVIDER_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/queqiao-phase3-poc"
          mkdir -p "$runtime_dir/state"
          approval="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")"
          jwt="$(node -e "console.log(require('node:crypto').randomBytes(48).toString('base64url'))")"
          printf '%s\n' "$approval" > "$runtime_dir/approval.secret"
          printf '%s\n' "$jwt" > "$runtime_dir/jwt.secret"
          printf '%s\n' "$PROVIDER_TOKEN" > "$runtime_dir/github.token"

          RUNTIME_DIR="$runtime_dir" SOURCE_REF="$SOURCE_REF" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          const runtimeDir = process.env.RUNTIME_DIR;
          const publicUrl = process.env.PUBLIC_URL.replace(/\/$/, "") + "/";
          const config = {
            version: 1,
            gateway: {
              publicBaseUrl: publicUrl,
              listen: { host: "127.0.0.1", port: 7575 },
              managementListen: { host: "127.0.0.1", port: 7574 },
              workerSessionListen: { host: "127.0.0.1", port: 7573 },
              livenessIntervalMs: 5000,
              trustProxyHops: 1,
              stateDirectory: path.join(runtimeDir, "state"),
              approvalSecretFile: path.join(runtimeDir, "approval.secret"),
              jwtSigningSecretFile: path.join(runtimeDir, "jwt.secret"),
              allowedRedirectOrigins: ["https://chatgpt.com"],
              runtimeProviders: {
                githubActions: {
                  owner,
                  repo,
                  workflowId: "runtime-provider-poc-worker.yml",
                  ref: process.env.SOURCE_REF,
                  tokenFile: path.join(runtimeDir, "github.token"),
                  audience: new URL("runtime/github-actions/claim", publicUrl).href
                }
              }
            },
            extensions: [],
            workspaces: []
          };
          fs.writeFileSync(path.join(runtimeDir, "config.json"), JSON.stringify(config, null, 2));
          NODE
          echo "QUEQIAO_CONFIG_FILE=$runtime_dir/config.json" >> "$GITHUB_ENV"
          echo "POC_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Start Gateway
        shell: bash
        env:
          QUEQIAO_G3_MCP_AUDIT_PROBE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.gate3_worker && inputs.gate3_mcp_audit && '1' || '0' }}
        run: |
          set -euo pipefail
          nohup npx tsx apps/gateway/src/index.ts > "$RUNNER_TEMP/queqiao-gateway.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/queqiao-gateway.pid"

          for i in {1..45}; do
            if [ -f "$POC_RUNTIME_DIR/state/management.secret" ] && curl -sS -o /dev/null http://127.0.0.1:7575/; then
              break
            fi
            sleep 1
          done
          test -f "$POC_RUNTIME_DIR/state/management.secret"

          external_ok=0
          for i in {1..45}; do
            code="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)"
            case "$code" in
              000|502|503|530|"") ;;
              *) external_ok=1; break ;;
            esac
            sleep 1
          done
          if [ "$external_ok" -ne 1 ]; then
            cat "$RUNNER_TEMP/cloudflared.log"
            cat "$RUNNER_TEMP/queqiao-gateway.log"
            exit 1
          fi

      - name: Provision ephemeral Worker through Runtime Provider
        shell: bash
        run: |
          set -euo pipefail
          management_secret="$(cat "$POC_RUNTIME_DIR/state/management.secret")"
          echo "::add-mask::$management_secret"

          request_json="$(node <<'NODE'
          const g3=process.env.G3_WORKER==="1";
          const metadata={poc:"phase3-e2e"};
          if(g3){
            Object.assign(metadata,{taskKind:"gate3-content",gate3Date:process.env.G3_DATE,
              controllerRunId:process.env.GITHUB_RUN_ID,controllerRunAttempt:process.env.GITHUB_RUN_ATTEMPT,
              sourceRevision:process.env.GITHUB_SHA});
          }
          process.stdout.write(JSON.stringify({ttlSeconds:g3?720:180,metadata}));
          NODE
          )"
          response="$(curl -fsS -H 'content-type: application/json' \
            -H "x-queqiao-management-secret: $management_secret" \
            -d "$request_json" http://127.0.0.1:7574/runtimes/github-actions)"

          lease_id="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).leaseId))")"
          worker_run_id="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).providerMetadata?.runId||''))")"
          environment_id="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).providerMetadata?.environmentId||''))")"
          state="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).state))")"
          test "$state" = "provisioning"
          test -n "$worker_run_id"
          test -n "$environment_id"

          echo "LEASE_ID=$lease_id" >> "$GITHUB_ENV"
          echo "WORKER_RUN_ID=$worker_run_id" >> "$GITHUB_ENV"
          echo "EXPECTED_ENVIRONMENT_ID=$environment_id" >> "$GITHUB_ENV"
          echo "MANAGEMENT_SECRET=$management_secret" >> "$GITHUB_ENV"

      - name: Wait for Worker registration and ready lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_state=""
          for i in {1..120}; do
            lease="$(curl -fsS -H "x-queqiao-management-secret: $MANAGEMENT_SECRET" "http://127.0.0.1:7574/runtimes/$LEASE_ID")"
            final_state="$(printf '%s' "$lease" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).state))")"
            if [ "$final_state" = "ready" ]; then
              break
            fi
            if [ "$final_state" = "failed" ] || [ "$final_state" = "expired" ] || [ "$final_state" = "disposed" ]; then
              printf '%s\n' "$lease"
              exit 1
            fi

            run_state="$(curl -fsS               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer $GH_TOKEN"               -H 'X-GitHub-Api-Version: 2026-03-10'               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$WORKER_RUN_ID")"
            worker_status="$(printf '%s' "$run_state" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).status||''))")"
            worker_conclusion="$(printf '%s' "$run_state" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).conclusion||''))")"
            if [ "$worker_status" = "completed" ] && [ "$worker_conclusion" != "success" ]; then
              echo "Worker run completed before lease became ready: $worker_conclusion"
              exit 1
            fi
            sleep 1
          done
          test "$final_state" = "ready"

          curl -fsS "$PUBLIC_URL/health" >/dev/null
          workers="$(curl -fsS -H "x-queqiao-management-secret: $MANAGEMENT_SECRET" http://127.0.0.1:7574/workers)"
          WORKERS_JSON="$workers" node <<'NODE'
          const body = JSON.parse(process.env.WORKERS_JSON);
          const expected = process.env.EXPECTED_ENVIRONMENT_ID;
          if (!body.workers?.some((worker) => worker.environmentId === expected)) {
            throw new Error("Expected ephemeral Worker membership was not found");
          }
          NODE

      - name: Execute authenticated MCP run on remote CI Browser Harness
        if: github.event_name == 'pull_request' || !inputs.gate3_worker
        shell: bash
        run: |
          set -euo pipefail
          export QUEQIAO_POC_PUBLIC_URL="$PUBLIC_URL"
          export QUEQIAO_POC_LOCAL_URL="http://127.0.0.1:7575"
          export QUEQIAO_POC_APPROVAL_SECRET_FILE="$POC_RUNTIME_DIR/approval.secret"
          export QUEQIAO_POC_ENVIRONMENT_ID="$EXPECTED_ENVIRONMENT_ID"
          export QUEQIAO_POC_WORKER_RUN_ID="$WORKER_RUN_ID"
          npx tsx apps/gateway/src/poc-browser-worker-client.ts
      - name: Execute authenticated MCP read of same-Worker G3.2 content
        if: github.event_name == 'workflow_dispatch' && inputs.gate3_worker
        shell: bash
        run: |
          set -euo pipefail
          export QUEQIAO_POC_PUBLIC_URL="$PUBLIC_URL"
          export QUEQIAO_POC_LOCAL_URL="http://127.0.0.1:7575"
          export QUEQIAO_POC_APPROVAL_SECRET_FILE="$POC_RUNTIME_DIR/approval.secret"
          export QUEQIAO_POC_ENVIRONMENT_ID="$EXPECTED_ENVIRONMENT_ID"
          export QUEQIAO_POC_WORKER_RUN_ID="$WORKER_RUN_ID"
          export QUEQIAO_POC_CONTROLLER_RUN_ID="$GITHUB_RUN_ID"
          export QUEQIAO_POC_CONTROLLER_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          export QUEQIAO_POC_GATE3_DATE="$G3_DATE"
          export QUEQIAO_POC_G3_PROOF_PATH="$RUNNER_TEMP/gate3-worker-proof.json"
          if [ "${G3_MCP_AUDIT:-0}" = "1" ]; then
            export QUEQIAO_POC_LEASE_ID="$LEASE_ID"
            export QUEQIAO_POC_G3_MCP_RECEIPT_PATH="$RUNNER_TEMP/gate3-mcp-receipt.json"
            export QUEQIAO_POC_G3_GITHUB_RECEIPT_PATH="$RUNNER_TEMP/gate3-github-receipt.json"
          fi
          if [ "${G345_DELEGATED_HANDOFF:-0}" = "1" ]; then
            export QUEQIAO_POC_G345_ORIGINAL_ARTIFACT_PATH="$RUNNER_TEMP/gate3-original-validated-artifact.json"
          fi
          npx tsx apps/gateway/src/poc-gate3-worker-client.ts

      - name: Verify independent original Gateway L3 audit evidence
        if: github.event_name == 'workflow_dispatch' && inputs.gate3_worker && inputs.gate3_mcp_audit
        shell: bash
        run: |
          set -euo pipefail
          export G3_PROOF_PATH="$RUNNER_TEMP/gate3-worker-proof.json"
          export G3_MCP_RECEIPT_PATH="$RUNNER_TEMP/gate3-mcp-receipt.json"
          export G3_GATEWAY_STATE_DIR="$POC_RUNTIME_DIR/state"
          export G3_AUDIT_PROOF_PATH="$RUNNER_TEMP/gate3-audit-evidence.json"
          npx tsx apps/gateway/src/poc-gate3-audit-finalize.ts

      - name: Verify original Gateway GitHub HEAD audit before lease disposal
        if: github.event_name == 'workflow_dispatch' && inputs.gate3_worker && inputs.gate3_mcp_audit
        shell: bash
        run: |
          set -euo pipefail
          export G3_AUDIT_PROOF_PATH="$RUNNER_TEMP/gate3-audit-evidence.json"
          export G3_GITHUB_RECEIPT_PATH="$RUNNER_TEMP/gate3-github-receipt.json"
          export G3_GATEWAY_STATE_DIR="$POC_RUNTIME_DIR/state"
          export G3_GITHUB_AUDIT_PROOF_PATH="$RUNNER_TEMP/gate3-github-evidence.json"
          npx tsx apps/gateway/src/poc-gate3-github-finalize.ts

      - name: Complete lease and verify provider cancellation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          completed="$(curl -fsS -X POST             -H "x-queqiao-management-secret: $MANAGEMENT_SECRET"             "http://127.0.0.1:7574/runtimes/$LEASE_ID/complete")"
          final_state="$(printf '%s' "$completed" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).state))")"
          test "$final_state" = "disposed"

          conclusion=""
          for i in {1..120}; do
            run_state="$(curl -fsS               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer $GH_TOKEN"               -H 'X-GitHub-Api-Version: 2026-03-10'               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$WORKER_RUN_ID")"
            status="$(printf '%s' "$run_state" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).status||''))")"
            conclusion="$(printf '%s' "$run_state" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).conclusion||''))")"
            if [ "$status" = "completed" ]; then break; fi
            sleep 1
          done
          test "$conclusion" = "cancelled"
          printf '{"leaseId":"%s","workerRunId":"%s","environmentId":"%s","leaseState":"disposed","workerConclusion":"cancelled"}\n'             "$LEASE_ID" "$WORKER_RUN_ID" "$EXPECTED_ENVIRONMENT_ID"
          if [ "${G3_WORKER:-0}" = "1" ]; then
            export G3_PROOF_PATH="$RUNNER_TEMP/gate3-worker-proof.json"
            export G3_FINAL_PROOF_PATH="$RUNNER_TEMP/gate3-controller-complete.json"
            export G3_VERIFIED_LEASE_STATE="$final_state"
            export G3_VERIFIED_WORKER_CONCLUSION="$conclusion"
            export G3_EXPECTED_WORKER_RUN_ID="$WORKER_RUN_ID"
            export G3_EXPECTED_LEASE_ID="$LEASE_ID"
            export G3_EXPECTED_ENVIRONMENT_ID="$EXPECTED_ENVIRONMENT_ID"
            export G3_EXPECTED_DATE="$G3_DATE"
            npx tsx apps/gateway/src/poc-gate3-worker-finalize.ts
          fi


      - name: Build exact synthetic ChatGPT delegated handoff after disposed lease
        if: github.event_name == 'workflow_dispatch' && inputs.gate3_worker && inputs.gate3_mcp_audit && inputs.gate3_delegated_handoff && success()
        shell: bash
        run: |
          set -euo pipefail
          export G3_EXPECTED_WORKER_RUN_ID="$WORKER_RUN_ID"
          export G345_ORIGINAL_ARTIFACT_PATH="$RUNNER_TEMP/gate3-original-validated-artifact.json"
          export G345_COMPLETION_PATH="$RUNNER_TEMP/gate3-controller-complete.json"
          export G345_WORKER_AUDIT_PATH="$RUNNER_TEMP/gate3-audit-evidence.json"
          export G345_HEAD_AUDIT_PATH="$RUNNER_TEMP/gate3-github-evidence.json"
          export G345_HANDOFF_PATH="$RUNNER_TEMP/gate3-delegated-handoff.json"
          npx tsx apps/gateway/src/poc-gate3-delegated-handoff-finalize.ts

      - name: Upload only public verified delegated synthetic handoff
        if: github.event_name == 'workflow_dispatch' && inputs.gate3_worker && inputs.gate3_mcp_audit && inputs.gate3_delegated_handoff && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate3-delegated-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-delegated-handoff.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload sanitized same-task G3.2 completion proof
        if: github.event_name == 'workflow_dispatch' && inputs.gate3_worker && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate3-worker-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-controller-complete.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload sanitized same-task G3.3 Gateway audit evidence
        if: github.event_name == 'workflow_dispatch' && inputs.gate3_worker && inputs.gate3_mcp_audit && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate3-audit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-audit-evidence.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload sanitized same-task G3.3 GitHub target audit evidence
        if: github.event_name == 'workflow_dispatch' && inputs.gate3_worker && inputs.gate3_mcp_audit && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate3-github-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-github-evidence.json
          retention-days: 7
          if-no-files-found: error

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '--- gateway log ---'
          tail -200 "$RUNNER_TEMP/queqiao-gateway.log" 2>/dev/null || true
          echo '--- cloudflared log ---'
          tail -120 "$RUNNER_TEMP/cloudflared.log" 2>/dev/null || true

      - name: Dispose Worker if MCP acceptance fails
        if: failure()
        shell: bash
        run: |
          if [ -n "${LEASE_ID:-}" ] && [ -n "${MANAGEMENT_SECRET:-}" ]; then
            curl -fsS -X POST \
              -H "x-queqiao-management-secret: $MANAGEMENT_SECRET" \
              "http://127.0.0.1:7574/runtimes/$LEASE_ID/complete" >/dev/null || true
          fi
      - name: Cleanup controller
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/queqiao-gateway.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/queqiao-gateway.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/cloudflared.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null || true
          fi

  gate3-audit-recheck:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.gate3_worker && inputs.gate3_mcp_audit
    needs: phase3-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Independently download original sanitized Gateway event artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate3-audit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-audit-recheck
      - name: Independently recheck same-run Gateway audit archive
        env:
          G3_AUDIT_ARTIFACT_PATH: ${{ runner.temp }}/gate3-audit-recheck/gate3-audit-evidence.json
        run: npx tsx apps/gateway/src/poc-gate3-audit-artifact.ts
      - name: Independently download original GitHub HEAD Gateway event artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate3-github-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-github-recheck
      - name: Independently recheck same-run GitHub HEAD source event and Worker link
        env:
          G3_AUDIT_ARTIFACT_PATH: ${{ runner.temp }}/gate3-audit-recheck/gate3-audit-evidence.json
          G3_GITHUB_AUDIT_ARTIFACT_PATH: ${{ runner.temp }}/gate3-github-recheck/gate3-github-evidence.json
        run: npx tsx apps/gateway/src/poc-gate3-github-artifact.ts
      - name: Download original post-disposal Worker completion
        if: inputs.gate3_delegated_handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate3-worker-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-complete-recheck
      - name: Download only validated public synthetic handoff
        if: inputs.gate3_delegated_handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate3-delegated-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate3-delegated-recheck
      - name: Independently verify original Worker article, disposed lease and two Gateway archives
        if: inputs.gate3_delegated_handoff
        env:
          G345_HANDOFF_PATH: ${{ runner.temp }}/gate3-delegated-recheck/gate3-delegated-handoff.json
          G345_COMPLETION_PATH: ${{ runner.temp }}/gate3-complete-recheck/gate3-controller-complete.json
          G345_WORKER_AUDIT_PATH: ${{ runner.temp }}/gate3-audit-recheck/gate3-audit-evidence.json
          G345_HEAD_AUDIT_PATH: ${{ runner.temp }}/gate3-github-recheck/gate3-github-evidence.json
        run: npx tsx apps/gateway/src/poc-gate3-delegated-handoff-recheck.ts