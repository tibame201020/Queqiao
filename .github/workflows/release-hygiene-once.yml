name: Release Hygiene Once

on:
  push:
    branches:
      - release/v0.9.7-hygiene

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.9.7-hygiene
      - name: Finalize v0.9.7 metadata and notes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = '0.9.7';
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package metadata missing');
          lock.packages[''].version = '0.9.7';
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const heading = '## 0.9.7 - 2026-09-04\n\n';
          if (!changelog.includes(heading)) throw new Error('0.9.7 changelog heading missing');
          const additions = [
            '- Adds Worker-authoritative Extension runtime services for downstream transports: manifest-declared executable/origin policy, bounded managed stdio including lifecycle-bound MCP sessions, and fetch-compatible streaming HTTP with exact-origin, redirect, body/header/response, cancellation, and cleanup enforcement.',
            '- Validates the public Extension SDK with real official MCP stdio and Streamable HTTP clients, external ESM consumer compilation, and internal/published type-contract parity without exposing private Worker capabilities.',
            '- Refocuses the root English and Traditional Chinese READMEs on a first working deployment: one explicit result per step, topology guidance before setup, completion criteria, and single-task recordings only where motion materially helps.'
          ].join('\n') + '\n';
          if (!changelog.includes('Worker-authoritative Extension runtime services')) {
            changelog = changelog.replace(heading, heading + additions);
            fs.writeFileSync(changelogPath, changelog);
          }

          fs.rmSync('.github/workflows/release-hygiene-once.yml');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json CHANGELOG.md .github/workflows/release-hygiene-once.yml
          git diff --cached --check
          git commit -m "chore(release): finalize v0.9.7 metadata"
          git push origin HEAD:release/v0.9.7-hygiene
