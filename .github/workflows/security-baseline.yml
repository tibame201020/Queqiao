name: Security Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-gate:
    name: Adversarial gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - if: runner.os != 'Windows'
        run: npm run typecheck && npm run test:security
      - if: runner.os == 'Windows'
        run: npm run typecheck && npm run test:security -- --maxWorkers=2

  dependency-gate:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts
      - name: Audit runtime dependencies
        id: npm-audit
        shell: bash
        run: |
          for attempt in 1 2 3; do
            set +e
            output=$(npm audit --package-lock-only --omit=dev --audit-level=high --fetch-timeout=30000 --fetch-retries=0 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! printf '%s\n' "$output" | grep -Eqi 'audit endpoint returned an error|network timeout|503 Service Unavailable|ECONNRESET|ETIMEDOUT'; then
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo 'unavailable=true' >> "$GITHUB_OUTPUT"

      - name: OSV fallback when npm advisory service is unavailable
        if: steps.npm-audit.outputs.unavailable == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --lockfile=package-lock.json