name: Resource Safety Baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    if: github.event_name != 'schedule'
    name: Resource safety baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run packaged resource baseline
        run: npm run resource:gate
        env:
          QUEQIAO_RESOURCE_REPORT: resource-safety-${{ runner.os }}.json
      - name: Upload resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-safety-${{ runner.os }}
          path: resource-safety-${{ runner.os }}.json
          if-no-files-found: warn

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Resource soak (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run packaged resource soak
        run: npm run resource:soak
        env:
          QUEQIAO_RESOURCE_REPORT: resource-soak-${{ runner.os }}.json
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-soak-${{ runner.os }}
          path: resource-soak-${{ runner.os }}.json
          if-no-files-found: warn
