version: 1
gateway:
  publicBaseUrl: https://example.invalid/
  listen:
    host: 127.0.0.1
    port: 7575
  # Optional cross-machine Worker sessions. Prefer `queqiao gateway setup
  # --worker-session-host <reachable-dns-or-ip>` so TLS files are generated securely.
  # workerSessionListen:
  #   host: 0.0.0.0
  #   port: 7573
  # workerSessionAdvertiseHost: gateway.local
  # workerSessionTls:
  #   certFile: /replace/with/queqiao/data/secrets/worker-session.crt
  #   keyFile: /replace/with/queqiao/data/secrets/worker-session.key
  trustProxyHops: 1
  stateDirectory: /replace/with/queqiao/data/gateway
  approvalSecretFile: /replace/with/queqiao/data/secrets/oauth-approval.secret
  jwtSigningSecretFile: /replace/with/queqiao/data/secrets/jwt-signing.secret
  allowedRedirectOrigins:
    - https://chatgpt.com
    - http://127.0.0.1
    - http://localhost
worker:
  workerId: 11111111-1111-4111-8111-111111111111
  environmentId: local
  listen:
    host: 127.0.0.1
    port: 7576
  tokenFile: /replace/with/queqiao/data/secrets/worker-token.secret
  # Created automatically after a successful remote `worker join`:
  # reverseSession:
  #   target: gateway.local:7573
  #   caCertificateFile: /replace/with/queqiao/data/secrets/worker-session-ca.crt
workspaces:
  - id: project
    displayName: Project
    root: /replace/with/project
    profile: read-only
    tools:
      allow: []
      deny: []
      explicit: []
    commands:
      allow: []
    stepUp: []
